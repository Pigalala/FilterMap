plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.jspecify:jspecify:1.0.0'

    testImplementation platform('org.junit:junit-bom:6.1.0-M1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'dev.piggle'
            artifactId = 'FilterMap'
            version = project.version.toString()

            from components.java

            pom {
                name.set artifactId
                description.set project.description

                scm {
                    connection.set 'scm:git:git://github.com/Pigalala/FilterMap.git'
                    developerConnection.set 'scm:git:git@github.com:Pigalala/FilterMap.git'
                    url.set 'https://github.com/Pigalala/FilterMap'
                    tag.set System.getenv('TAG_VERSION') == null ? 'HEAD' : System.getenv('TAG_VERSION')
                }

                ciManagement {
                    system.set 'Github Actions'
                    url.set 'https://github.com/Pigalala/FilterMap/actions'
                }

                issueManagement {
                    system.set 'GitHub'
                    url.set 'https://github.com/Pigalala/FilterMap/issues'
                }

                developers {
                    developer {
                        id.set 'pigalala'
                        name.set 'Piggle'
                        email.set 'w8888mc@gmail.com'
                    }
                }

                licenses {
                    license {
                        name.set 'MIT'
                        url.set 'https://github.com/Pigalala/FilterMap/blob/master/LICENSE'
                    }
                }
            }
        }
    }
}

signing {
    useInMemoryPgpKeys System.getenv("SIGNING_KEY"), System.getenv("SIGNING_PASSWORD")
    sign publishing.publications.maven
}
